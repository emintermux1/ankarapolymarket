[project]
name = "ankara-ltac-weather-bot"
version = "0.1.0"
description = "Ankara Esenboga LTAC daily high temperature forecast and Polymarket pricing intelligence bot"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4",
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "matplotlib>=3.9.2",
    "numpy>=2.1.1",
    "pandas>=2.2.2",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.7.1",
    "python-dotenv>=1.0.1",
    "python-telegram-bot>=21.4",
    "SQLAlchemy>=2.0.34",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=72.1.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
